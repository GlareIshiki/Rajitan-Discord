version: 1

meta:
  display_name: "キュー管理"
  category: music_player
  icon: "list-music"
  tags: ["music", "voice", "queue"]

ai:
  name: music_queue
  description: |
    現在の再生キューを表示する。キュー内の曲一覧、合計時間、ループ設定を確認できる。
    キューのクリアや特定の曲の削除も可能。
  parameters:
    action:
      type: string
      required: false
      enum: [view, clear, remove]
      description: "view: 表示（デフォルト）, clear: 全削除, remove: 指定削除"
    index:
      type: integer
      required: false
      description: "削除する曲の番号（action=removeの場合）"
  hints: |
    - action省略時はキュー表示
    - removeの場合はindexが必要

execution:
  max_calls_per_execution: 3
  requires_context: true
  handler: builtin
  builtin: music_player_api
  _endpoint: /api/queue
  _method: POST
