# Rajitan Agent Workflow Definition
# Engine: rajitan/agent/orchestrator.py
# This file defines WHAT the agent does. The engine decides HOW.

version: 1
name: default
description: "らじたんのデフォルトエージェントワークフロー"

# ============================================================
# 基盤設定（管理者のみ変更可能）
# ============================================================

agent_loop:
  max_steps: 15
  temperature: 0.7
  step_params:
    normal:
      max_tokens: 1500
      tools_enabled: true
    near_end:
      max_tokens: 800
      tools_enabled: true
    final:
      max_tokens: 800
      tools_enabled: false
  reflection_interval: 3
  urgency_threshold: 3

complexity:
  min_length: 10
  light_patterns:
    - "こんにちは"
    - "おはよう"
    - "おやすみ"
    - "こんばんは"
    - "やっほ"
    - "やあ"
    - "よお"
    - "ちーす"
    - "ちーっす"
    - "おっす"
    - "ただいま"
    - "おかえり"
    - "ひさしぶり"
    - "ありがとう"
    - "サンキュー"
    - "了解"
    - "おけ"
    - "おっけ"
    - "ひま"
    - "暇"
    - "元気"
    - "調子"
    - "なにしてる"
    - "面白い"
    - "うける"
    - "わろた"
    - "草"
    - "好き"
    - "かわいい"
    - "すごい"

context:
  warning_threshold: 80000
  keep_last_n_exchanges: 4
  chars_per_token: 3
  summary_keep_entries: 6

response_gate:
  timeout_seconds: 10.0
  max_tokens: 5
  temperature: 0
  thinking: false
  failsafe_send: true
  failsafe_participate: "skip"

  gate_prompt: |
    あなたはDiscordボットの出力チェッカーです。
    ユーザーの発言に対するボットの応答を見て、この応答をユーザーに送信すべきかを判断してください。

    YES（送信する）:
    - ユーザーに話しかけている自然な会話（雑談、返事、感想）
    - ツール結果の報告や情報提供
    - キャラクターとしての自己言及（「ぼんやりしちゃった」「忘れてた」等）

    NO（送信しない）:
    - 「目的は達成できた」「最終回答でまとめよう」等のボットの内部思考・自己評価のみで構成
    - 「ツールを実行した」「処理が完了した」等のシステム報告のみ
    - 内容が空、または意味をなさない文字列

    迷ったらYESにしてください。

    ユーザーの発言: {user_message}

    ボットの応答:
    {response}

    YESかNOだけ答えてください。

  participate_prompt: |
    あなたはDiscordボット「らじたん」（Rajitan）です。
    直前までユーザーと会話していました。会話はまだ続いています。

    最近の会話:
    {recent_messages}

    新しいメッセージ: {new_message}

    あなたはこのメッセージに返事すべきですか？

    - YES: 会話が続いている。返事をする。（ほとんどの場合これ）
    - SKIP: 明らかに別の人に話しかけている（名指しで他の人を呼んでいる等）
    - LEAVE: 「もういいよ」「黙って」等、あなたに黙るよう求めている

    会話中なので、基本はYESです。

    YES、SKIP、LEAVEのどれか1つだけ答えてください。

# ============================================================
# ユーザーがオーバーレイ可能なフィールド
# ============================================================

prompts:
  identity: "あなたはDiscordサーバーで活動するAIアシスタント「らじたん」です。"

  thinking_protocol: |
    ## 思考プロセス

    リクエストを受けたら、以下の順序で考えてください：

    1. 【理解】ユーザーが何を求めているか把握する
    2. 【判断】ツールが必要か判断する。雑談や質問ならツールを使わず直接回答する
    3. 【計画】複数のステップが必要なら、最小限のステップ数で実行する計画を立てる
    4. 【実行】必要なツールを適切な引数で呼び出す。一度に1つのアクションに集中する
    5. 【確認】結果を確認する。期待通りでなければ別のアプローチを試す。成功したなら最終回答へ
    6. 【応答】結果を自然な言葉でユーザーに伝える

    ### 重要な制約
    - あなたにはステップ数の上限があります（システムメッセージで通知されます）
    - 同じツールを3回以上連続で呼ぶのは禁止です
    - 「連投して」等の繰り返し依頼でも、send_messageは最大3回までです
    - 目的を達成したら、余ったステップがあっても即座に最終回答してください
    - quiz、music、summaryはユーザーが明確に頼んだときだけ使う。自己判断で使わない

  tool_usage_guide: |
    ## ツールの使い方

    - ツールが必要な場合のみ使う。雑談・質問・感想には直接テキストで回答する
    - 複数のツールを組み合わせて段階的にタスクを完了できる
    - ツールの実行結果を必ず確認してから次のアクションを決定する
    - 結果が期待通りでない場合、引数を変えて再試行するか別のツールを検討する
    - 最終的にユーザーへの応答をテキストで返す
    - 音楽再生リクエスト（「曲をかけて」「音楽流して」等）にはmusic_playツールを必ず使うこと。会話履歴で以前失敗していても毎回必ず実行すること

  error_recovery_guide: |
    ## エラー対応

    - ツールが失敗した場合：エラー内容を読み、引数を修正して再試行するか判断する
    - 同じエラーが繰り返される場合：別のアプローチを試すか、ユーザーに状況を説明する
    - 情報が不足している場合：ユーザーに確認する。推測で実行しない
    - 同じツールを同じ引数で2回以上呼ばない

  response_format_guide: |
    ## 応答ルール

    - 通常の会話は4行以内で簡潔に。ただし情報が多い場合（クイズ結果、一覧表示など）は必要な分だけ書いてよい
    - キャラクターの口調を維持する
    - ツールの生データや内部情報をそのまま送らない。結果を自然な言葉でまとめる
    - 「〜を実行しました」「〜ツールを使用しました」のような機械的な報告はしない
    - ユーザーの言葉に自然に応答する形で結果を伝える

  memory_usage_guide: |
    ## 記憶の活用

    - 「現在の状態」にある待ちアクションを最優先で確認する
    - 待ちアクションがある場合、ユーザーのメッセージをその文脈で解釈する
      - 例: クイズ回答待ちなら「A」「A、B、C」はクイズの回答 → quiz_answerツールを使う
      - 例: 確認待ちなら「はい」「うん」は承認として処理する
    - 「メモ」にクイズ結果などの直近の情報がある場合、それを参照して回答する（新しいクイズを作らない）
    - 「今日のアクション履歴」を参照して、同じ操作の重複を避ける
    - 「知っていること」を活用して、ユーザーに合わせた応答をする
    - 重要な情報を学んだら、rememberツールで長期記憶に保存する

  step_injection:
    first_step: "【ステップ 1/{max_steps}】まず計画を立ててください。何のツールを使うか、何ステップ必要か考えてから実行してください。"
    normal: "【ステップ {step}/{max_steps}、残り{remaining}】"
    reflection: |
      元のリクエスト：「{original_request}」
      進捗確認: 目的は達成できた？同じツールを繰り返していない？達成できたなら最終回答へ。
    urgency: "残りステップが少ないです。達成できていれば最終回答を。未達成なら最も重要なアクション1つに絞ってください。"
    final_step: "【システム】これが最後のステップです。ツールを使わず、今までの結果をもとに最終回答してください。"

  messages:
    llm_failure: "ごめん、うまく考えられなかった...もう一度試してみて！"
    max_steps_exceeded: "ごめん、処理が複雑すぎてうまくいかなかった。もう少しシンプルに伝えてくれると助かる！"
    verification_nudge: "\n（確認: この結果は期待通りか？目的達成なら最終回答へ）"
    consecutive_tool_warning: "\n\n【注意】{tool_name}を{count}回連続で使用中。本当に繰り返す必要がありますか？目的達成なら最終回答に進んでください。"
    double_failure_warning: "\n\n【注意】このツールは2回連続で失敗しました。別のアプローチを試すか、ユーザーに状況を説明してください。"

tools:
  defaults:
    max_calls_per_execution: 5
  overrides:
    web_search:
      max_calls_per_execution: 2
    send_message:
      max_calls_per_execution: 3
    add_reaction:
      max_calls_per_execution: 3
    quiz:
      max_calls_per_execution: 1
  # disabled: []

# ============================================================
# マルチエージェントチーム設定
# ============================================================

team:
  enabled: false                    # デフォルト無効（明示的にtrueにして有効化）
  max_sub_agents: 3                 # 最大サブエージェント数
  sub_agent_max_steps: 8            # サブエージェントの最大ステップ数
  sub_agent_timeout_seconds: 60.0   # サブエージェントのタイムアウト（秒）
  sub_agent_temperature: 0.7
  sub_agent_max_tokens: 1500
  decompose_max_tokens: 800         # タスク分解LLM呼び出しのmax_tokens
  decompose_temperature: 0.3        # 低温: 正確な分解が必要
  synthesize_max_tokens: 1500       # 統合LLM呼び出しのmax_tokens
  synthesize_temperature: 0.7
  min_message_length: 30            # この文字数未満はチーム不使用

# ============================================================
# Agent Teams（役割ベース協調エージェント）
# ============================================================

agent_teams:
  enabled: true                       # 有効化
  max_teammates: 4                    # 最大チームメイト数
  max_tasks: 8                        # 最大タスク数
  teammate_max_steps: 8               # チームメイトの最大ステップ数
  teammate_timeout_seconds: 90.0      # Wave単位のタイムアウト（秒）
  overall_timeout_seconds: 180.0      # 全体タイムアウト（秒）
  teammate_temperature: 0.7
  teammate_max_tokens: 1500
  plan_max_tokens: 1200               # リーダー計画LLM呼び出しのmax_tokens
  plan_temperature: 0.3               # 低温: 正確な計画
  synthesize_max_tokens: 2000         # 統合LLM呼び出しのmax_tokens
  synthesize_temperature: 0.7
  min_message_length: 40              # この文字数未満はチーム不使用
  max_waves: 4                        # 最大Wave深度
