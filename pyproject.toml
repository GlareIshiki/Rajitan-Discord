[project]
name = "rajitan-discord"
version = "1.0.0"
description = "AIラジオDJ風Discordボット"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
authors = [
    {name = "GlareIshiki"},
]

dependencies = [
    "discord.py==2.3.2",
    "openai==1.51.0",
    "redis==4.5.4",
    "aiosqlite==0.19.0",
    "python-dotenv==1.0.0",
    "httpx==0.25.2",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "psutil==5.9.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["rajitan/tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
